<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>연령별 도서 선호도 및 인기 순위</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(135deg, #f5f7fa, #c3cfe2);
      font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', Arial, sans-serif;
      color: #333;
      line-height: 1.6;
    }

    .container {
      width: min(1000px, 94%);
      margin: 40px auto;
      background: #ffffff;
      border-radius: 24px;
      padding: 32px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
    }

    h1 {
      margin: 0 0 8px;
      text-align: center;
      font-size: 32px;
      color: #1a2a3a;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 32px;
      font-size: 15px;
    }

    /* 연령대 탭 스타일 */
    .tabs {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 8px;
      margin-bottom: 28px;
    }

    .tab-btn {
      border: none;
      background: #f0f2f5;
      color: #555;
      padding: 12px 0;
      font-size: 16px;
      font-weight: bold;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s ease;
      text-align: center;
    }

    .tab-btn:hover {
      background: #e1e4e9;
    }

    .tab-btn.active {
      background: #42a5f5;
      color: white;
      box-shadow: 0 4px 12px rgba(66, 165, 245, 0.3);
    }

    /* 메인 콘텐츠 구조 */
    .content-grid {
      display: grid;
      grid-template-columns: 1.2fr 1fr;
      gap: 28px;
    }

    /* 1위 도서 상세 정보 스페이스 */
    .featured-box {
      background: #f8fafc;
      border-radius: 20px;
      padding: 24px;
      border: 1px solid #e2e8f0;
    }

    .badge {
      display: inline-block;
      background: #ff7043;
      color: white;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
      margin-bottom: 12px;
    }

    .book-title {
      font-size: 24px;
      margin: 0 0 4px;
      color: #0f172a;
    }

    .book-author {
      font-size: 14px;
      color: #64748b;
      margin-bottom: 20px;
    }

    .section-title {
      font-size: 16px;
      font-weight: bold;
      color: #334155;
      margin: 16px 0 6px;
      border-left: 4px solid #42a5f5;
      padding-left: 8px;
    }

    .book-desc {
      font-size: 15px;
      color: #334155;
      background: white;
      padding: 14px;
      border-radius: 12px;
      border: 1px solid #f1f5f9;
    }

    .review-item {
      background: #fff8e1;
      color: #5d4037;
      padding: 12px 14px;
      border-radius: 12px;
      font-size: 14px;
      margin-bottom: 8px;
      font-style: italic;
    }

    /* 30위 리스트 스페이스 */
    .rank-box {
      background: #ffffff;
      border-radius: 20px;
      padding: 24px;
      border: 1px solid #e2e8f0;
      max-height: 520px;
      overflow-y: auto;
    }

    .rank-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .rank-item {
      display: flex;
      align-items: center;
      padding: 10px 14px;
      background: #f8fafc;
      border-radius: 10px;
      font-size: 14px;
      border: 1px solid #f1f5f9;
    }

    .rank-number {
      font-weight: bold;
      width: 28px;
      color: #64748b;
    }

    .rank-item:nth-child(-n+3) .rank-number {
      color: #42a5f5;
      font-size: 16px;
    }

    .rank-title {
      font-weight: 600;
      color: #1e293b;
      flex-grow: 1;
    }

    .rank-author {
      font-size: 12px;
      color: #94a3b8;
    }

    /* 스크롤바 디자인 */
    .rank-box::-webkit-scrollbar {
      width: 6px;
    }
    .rank-box::-webkit-scrollbar-track {
      background: #f1f5f9;
    }
    .rank-box::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 4px;
    }

    @media (max-width: 850px) {
      .tabs {
        grid-template-columns: repeat(3, 1fr);
      }
      .content-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

    // 연령대 전환 함수
    function switchAgeGroup(age) {
      // 1. 탭 버튼 활성화 변경
      const buttons = document.querySelectorAll('.tab-btn');
      buttons.forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');

      // 2. 해당 연령 데이터 확보
      const data = ageData[age];
      if (!data) return;

      // 3. 1위 도서 영역 정보 업데이트
      document.getElementById('featuredTitle').textContent = data.title;
      document.getElementById('featuredAuthor').textContent = data.author + " 저";
      document.getElementById('featuredDesc').textContent = data.desc;

      // 후기 바인딩
      const reviewsContainer = document.getElementById('featuredReviews');
      reviewsContainer.innerHTML = '';
      data.reviews.forEach(review => {
        const div = document.createElement('div');
        div.className = 'review-item';
        div.textContent = review;
        reviewsContainer.appendChild(div);
      });

      // 4. 30위 순위 리스트 재생성
      const rankContainer = document.getElementById('rankListContainer');
      rankContainer.innerHTML = '';
      
      data.rank.forEach((item, index) => {
        const itemDiv = document.createElement('div');
        itemDiv.className = 'rank-item';
        itemDiv.innerHTML = `
          <span class="rank-number">${index + 1}</span>
          <span class="rank-title">${escapeHTML(item.t)}</span>
          <span class="rank-author">${escapeHTML(item.a)}</span>
        `;
        rankContainer.appendChild(itemDiv);
      });
    }

    // 간단한 HTML 이스케이프 함수
    function escapeHTML(text) {
      return String(text)
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;');
    }

    // 초기 화면 구동 (10대 데이터 바인딩)
    window.onload = function() {
      switchAgeGroup('10');
    };
  </script>
