<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>배리어프리 세대별 북 대시보드 & AI 캐스터</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(135deg, #f1f5f9, #e2e8f0);
      font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', Arial, sans-serif;
      color: #1e293b;
      line-height: 1.6;
    }
    .container {
      width: min(1200px, 94%);
      margin: 30px auto;
      background: #ffffff;
      border-radius: 28px;
      padding: 32px;
      box-shadow: 0 20px 40px rgba(15, 23, 42, 0.08);
    }
    
    /* 인증 및 헤더 라인 */
    header {
      display: flex; justify-content: space-between; align-items: center;
      border-bottom: 2px solid #f1f5f9; padding-bottom: 20px; margin-bottom: 24px;
    }
    h1 { margin: 0; font-size: 26px; color: #0f172a; }
    .auth-panel { display: flex; align-items: center; gap: 12px; }
    .user-info { font-size: 14px; color: #475569; font-weight: 500; }
    .btn-auth {
      border: none; padding: 10px 18px; font-size: 14px; font-weight: bold;
      border-radius: 12px; cursor: pointer; transition: all 0.2s;
    }
    .btn-login { background: #2563eb; color: white; }
    .btn-logout { background: #64748b; color: white; }

    /* 오디오 제어 마스터 바 */
    .audio-master-panel {
      display: flex; justify-content: center; gap: 10px; margin-bottom: 24px;
      background: #f8fafc; padding: 12px; border-radius: 16px; border: 1px solid #e2e8f0;
    }
    .audio-btn {
      border: none; padding: 8px 16px; font-size: 14px; font-weight: bold;
      border-radius: 8px; cursor: pointer; display: flex; align-items: center; gap: 6px;
      transition: all 0.2s;
    }
    .btn-stop { background: #ef4444; color: white; }
    .btn-pause { background: #f59e0b; color: white; }
    .btn-resume { background: #10b981; color: white; }

    /* 명예의 전당 및 AI 영역 */
    .grand-champion-box {
      background: linear-gradient(135deg, #1e1b4b, #311042);
      color: #ffffff; border-radius: 20px; padding: 24px; margin-bottom: 32px;
      display: flex; flex-direction: column; gap: 16px;
      box-shadow: 0 10px 25px rgba(49, 16, 66, 0.25); border: 2px solid #f59e0b;
    }
    .champion-title { font-size: 22px; margin: 0 0 4px; font-weight: 800; color: #f59e0b; }
    .ai-btn-zone { display: flex; gap: 12px; align-items: center; }
    .btn-ai {
      background: linear-gradient(135deg, #a855f7, #7c3aed); color: white;
      border: none; padding: 12px 24px; font-size: 15px; font-weight: bold;
      border-radius: 12px; cursor: pointer; box-shadow: 0 4px 12px rgba(124, 58, 237, 0.3);
    }
    .ai-response {
      background: rgba(255, 255, 255, 0.1); border-left: 4px solid #a855f7;
      padding: 14px; border-radius: 8px; font-size: 14px; color: #e2e8f0; display: none;
    }

    /* 탭 스타일 */
    .tabs { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; margin-bottom: 28px; }
    .tab-btn {
      border: none; background: #f1f5f9; color: #475569; padding: 14px 0;
      font-size: 16px; font-weight: bold; border-radius: 14px; cursor: pointer;
      transition: all 0.15s ease; text-align: center;
    }
    .tab-btn.active { background: #2563eb; color: white; box-shadow: 0 6px 16px rgba(37, 99, 235, 0.25); }

    /* 메인 레이아웃 */
    .content-grid { display: grid; grid-template-columns: 1.2fr 1fr; gap: 32px; }
    
    /* 상세 정보창 (왼쪽) */
    .detail-box {
      background: #f8fafc; border-radius: 24px; padding: 28px; border: 1px solid #e2e8f0;
      position: sticky; top: 20px;
    }
    .badge { display: inline-block; background: #2563eb; color: white; padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: bold; margin-bottom: 14px; }
    .book-title-container { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .book-title { font-size: 24px; margin: 0; color: #0f172a; font-weight: 800; }
    .tts-btn { background: #10b981; color: white; border: none; padding: 8px 14px; font-size: 14px; border-radius: 10px; cursor: pointer; font-weight: bold; }
    .book-author { font-size: 15px; color: #64748b; margin: 6px 0 24px; }
    .section-title { font-size: 16px; font-weight: bold; color: #334155; margin: 24px 0 8px; border-left: 4px solid #2563eb; padding-left: 10px; }
    .book-desc { font-size: 15px; color: #334155; background: white; padding: 16px; border-radius: 14px; border: 1px solid #e2e8f0; margin: 0; }
    .review-item { background: #fef3c7; color: #78350f; padding: 14px; border-radius: 14px; font-size: 14px; margin-bottom: 10px; font-style: italic; border-left: 4px solid #f59e0b; }

    /* 순위 리스트 (오른쪽) */
    .rank-box { background: #ffffff; border-radius: 24px; padding: 8px; border: 1px solid #e2e8f0; max-height: 500px; overflow-y: auto; }
    .rank-list { display: flex; flex-direction: column; gap: 6px; }
    .rank-item { display: flex; align-items: center; padding: 14px 16px; background: #f8fafc; border-radius: 14px; font-size: 14px; border: 1px solid #f1f5f9; cursor: pointer; transition: all 0.15s ease; }
    .rank-item:hover { background: #eff6ff; transform: translateX(4px); }
    .rank-item.selected { background: #eff6ff; border-color: #2563eb; box-shadow: inset 4px 0 0 #2563eb; }
    .rank-number { font-weight: 800; width: 34px; color: #64748b; }
    .rank-title { font-weight: 600; color: #1e293b; flex-grow: 1; }
    .rank-author { font-size: 13px; color: #64748b; }

    /* 히스토리 로그 단 */
    .history-box { margin-top: 24px; background: #f8fafc; padding: 16px; border-radius: 16px; border: 1px solid #e2e8f0; }
    .history-item { font-size: 13px; color: #475569; padding: 4px 0; border-bottom: 1px dashed #e2e8f0; }

    @media (max-width: 850px) {
      .tabs { grid-template-columns: repeat(3, 1fr); }
      .content-grid { grid-template-columns: 1fr; }
      .detail-box { position: static; }
    }
  </style>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, collection, addDoc, query, where, getDocs, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    import { GoogleGenAI } from "https://esm.run/@google/genai";

    // ==========================================
    // 🛠️ 환경 설정 (본인의 실제 API 키 정보로 교체 필수)
    // ==========================================
    const firebaseConfig = {
      apiKey: "YOUR_FIREBASE_API_KEY",
      authDomain: "YOUR_FIREBASE_AUTH_DOMAIN",
      projectId: "YOUR_FIREBASE_PROJECT_ID",
      storageBucket: "YOUR_FIREBASE_STORAGE_BUCKET",
      messagingSenderId: "YOUR_FIREBASE_MESSAGING_SENDER_ID",
      appId: "YOUR_FIREBASE_APP_ID"
    };
    const GEMINI_API_KEY = "YOUR_GEMINI_API_KEY";

    // 인스턴스 초기화
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const provider = new GoogleAuthProvider();
    const ai = new GoogleGenAI({ apiKey: GEMINI_API_KEY });

    let currentUser = null;

    // 인증 상태 모니터링
    onAuthStateChanged(auth, (user) => {
      const authPanel = document.getElementById('authPanel');
      if (user) {
        currentUser = user;
        authPanel.innerHTML = `
          <span class="user-info">${user.displayName}님 로그인됨</span>
          <button id="btnLogout" class="btn-auth btn-logout">로그아웃</button>
        `;
        document.getElementById('btnLogout').addEventListener('click', handleLogout);
        loadUserLogs(user.uid);
      } else {
        currentUser = null;
        authPanel.innerHTML = `<button id="btnLogin" class="btn-auth btn-login">구글 로그인</button>`;
        document.getElementById('btnLogin').addEventListener('click', handleLogin);
        document.getElementById('historyList').innerHTML = '<p style="font-size:12px; color:#94a3b8; margin:0;">로그인 시 이전 AI 진단 내역이 로드됩니다.</p>';
      }
    });

    async function handleLogin() {
      try { await signInWithPopup(auth, provider); playCustomTTS("로그인에 성공했습니다."); } 
      catch (e) { console.error(e); }
    }
    async function handleLogout() {
      try { await signOut(auth); playCustomTTS("로그아웃 되었습니다."); } 
      catch (e) { console.error(e); }
    }

    // 🤖 Gemini AI 실시간 분석 연동 및 Firestore 자동 영속화
    async function askGeminiTrend() {
      const aiResponseBox = document.getElementById('aiResponse');
      aiResponseBox.style.display = "block";
      aiResponseBox.textContent = "Gemini 인공지능이 세대별 트렌드를 정밀 심층 분석 중입니다...";
      playCustomTTS("제미나이 인공지능 분석을 시작합니다.");

      try {
        const prompt = `${window.currentAgeGroup}대 독자들이 선호하는 도서 목록과 후기를 바탕으로, 왜 이 연령대가 이 책들에 열광하는지 핵심 요약을 해주고, 이 세대에게 건네는 짧은 따뜻한 격려사를 작성해줘.`;
        const response = await ai.models.generateContent({
          model: 'gemini-2.5-flash',
          contents: prompt,
        });

        const resultText = response.text;
        aiResponseBox.textContent = resultText;
        playCustomTTS(`분석 완료. 내용 요약입니다. ${resultText}`);

        // 로그인 상태라면 클라우드 데이터베이스에 실시간 분석 데이터 기록 연동
        if (currentUser) {
          await addDoc(collection(db, "user_book_logs"), {
            uid: currentUser.uid,
            ageGroup: window.currentAgeGroup,
            aiSummary: resultText,
            createdAt: new Date()
          });
          loadUserLogs(currentUser.uid);
        }
      } catch (error) {
        console.error(error);
        aiResponseBox.textContent = "API 키 오류 혹은 연결 제한으로 AI 응답을 가져오지 못했습니다.";
      }
    }

    // 💾 Firestore 기록 조회 불러오기
    async function loadUserLogs(uid) {
      const q = query(collection(db, "user_book_logs"), where("uid", "==", uid));
      const querySnapshot = await getDocs(q);
      const historyList = document.getElementById('historyList');
      historyList.innerHTML = '';
      
      if(querySnapshot.empty) {
        historyList.innerHTML = '<p style="font-size:12px; color:#94a3b8; margin:0;">아직 생성된 AI 리포트 이력이 없습니다.</p>';
        return;
      }
      querySnapshot.forEach((doc) => {
        const data = doc.data();
        const div = document.createElement('div');
        div.className = 'history-item';
        div.textContent = `• [${data.ageGroup}대 분석 완료] 클라우드 동기화 완료`;
        historyList.appendChild(div);
      });
    }

    // 전역 스코프 바인딩 전송
    window.askGeminiTrend = askGeminiTrend;
  </script>
</head>
<body>

  <div class="container">
    <header>
      <h1>세대별 도서 트렌드 & AI 배리어프리 캐스터 🎧</h1>
      <div class="auth-panel" id="authPanel">
        </div>
    </header>

    <div class="audio-master-panel" aria-label="음성 제어 바">
      <button class="audio-btn btn-pause" onclick="pauseTTS()">❚❚ 일시정지</button>
      <button class="audio-btn btn-resume" onclick="resumeTTS()">▶ 이어듣기</button>
      <button class="audio-btn btn-stop" onclick="stopTTS()">◼ 음성 끄기</button>
    </div>

    <div class="grand-champion-box">
      <div>
        <div class="champion-title">🏆 2026 전 세대 통산 판매율 1위 명예의 전당</div>
        <p style="margin:0; font-size:14px; color:#cbd5e1;"><strong>소년이 온다 (한강 저)</strong>: 대한민국 최초 노벨 문학상 수상 이후 전 연령층의 서재를 점령한 시대의 마스터피스 소설.</p>
      </div>
      <div class="ai-btn-zone">
        <button class="btn-ai" onclick="askGeminiTrend()">✨ 현재 세대 트렌드 AI 정밀 분석 요청</button>
        <button style="background:transparent; border:1px solid #f59e0b; color:#f59e0b;" class="audio-btn" onclick="playCustomTTS('명예의전당 일위 도서 소년이온다 한강 저 소설입니다.')">🎧 도서 스피치</button>
      </div>
      <div class="ai-response" id="aiResponse">AI 분석 결과 창</div>
    </div>

    <div class="tabs" id="tabContainer" role="tablist">
      <button class="tab-btn active" role="tab" onclick="switchAgeGroup('10', this)">10대</button>
      <button class="tab-btn" role="tab" onclick="switchAgeGroup('20', this)">20대</button>
      <button class="tab-btn" role="tab" onclick="switchAgeGroup('30', this)">30대</button>
      <button class="tab-btn" role="tab" onclick="switchAgeGroup('40', this)">40대</button>
      <button class="tab-btn" role="tab" onclick="switchAgeGroup('50', this)">50대</button>
      <button class="tab-btn" role="tab" onclick="switchAgeGroup('60', this)">60대+</button>
    </div>

    <div class="content-grid">
      <div class="detail-box">
        <div class="badge" id="infoBadge">1위 도서 정보</div>
        <div class="book-title-container">
          <h2 class="book-title" id="detailTitle">책 제목</h2>
          <button class="tts-btn" onclick="playCurrentBookTTS()">🔊 상세 본문 통독</button>
        </div>
        <div class="book-author" id="detailAuthor">저자 정보</div>

        <div class="section-title">책 소개 및 시놉시스</div>
        <p class="book-desc" id="detailDesc">내용</p>

        <div class="section-title">독자층 실제 리뷰 생생 교차 검증</div>
        <div id="detailReviews"></div>
      </div>

      <div>
        <div style="font-weight: bold; margin-bottom: 12px; color: #475569; padding-left: 4px;">
          <span id="listAgeLabel">10대</span> 베스트 컬렉션 (TOP 5)
        </div>
        <div class="rank-box">
          <div class="rank-list" id="rankListContainer" role="listbox"></div>
        </div>

        <div class="history-box">
          <h4 style="margin: 0 0 10px 0; font-size: 14px; color:#1e293b;">📊 나의 실시간 연동 이력 (Firestore)</h4>
          <div id="historyList"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // 📚 데이터 전면 맞춤 분리 정교화
    window.currentAgeGroup = "10";
    const ageData = {

        {t: "흔한남매", a: "흔한남매", d: "순도 100퍼센트 현실 남매 코믹 에피소드로 전국의 급식 학년 독자층을 장악한 일상툰.", r: ["독서실에서 보다가 현실 웃음 터져서 혼남.", "동생이랑 공감대 형성하기 딱 좋아요."]},
        {t: "최태성 별별한국사", a: "최태성", d: "단기간에 한능검 합격 및 내신 관리를 잡게 도와주는 대한민국 수험표 필수 교재.", r: ["큰별쌤 가르침은 평생 안 잊혀질 듯.", "구조화된 도표가 가독성 최고입니다."]},
        {t: "주술회전", a: "아쿠타미 게게", d: "저주를 퇴치하는 주술사들의 목숨을 건 사투를 정교하게 그려낸 다크 판타지 만화 고점 편.", r: ["액션 작화와 연출이 가히 압도적입니다.", "매달 용돈 모아 단행본 사는 낙으로 살아요."]},

    // 🎧 통합 TTS 오디오 엔진 제어 파트
    function playCustomTTS(text) {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel(); // 이전 소리 강제 차단 인터럽트
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'ko-KR';
      utterance.rate = 1.0;
      utterance.pitch = 1.0;
      window.speechSynthesis.speak(utterance);
    }

    function stopTTS() { window.speechSynthesis.cancel(); }
    function pauseTTS() { window.speechSynthesis.pause(); }
    function resumeTTS() { window.speechSynthesis.resume(); }

    // 🔄 연령대 전환 탭 함수
    function switchAgeGroup(age, element) {
      window.currentAgeGroup = age;
      const buttons = document.querySelectorAll('.tab-btn');
      buttons.forEach(btn => btn.classList.remove('active'));
      if(element) element.classList.add('active');

      const displayLabel = age === "60" ? "60대 이상" : age + "대";
      document.getElementById('listAgeLabel').textContent = displayLabel;

      // 시각장애인 배리어프리 오디오 알림 피드백 트리거
      playCustomTTS(`${displayLabel} 데이터 동기화 완료되었습니다.`);
      document.getElementById('aiResponse').style.display = "none"; // 탭 변경 시 이전 분석 초기화

      const listContainer = document.getElementById('rankListContainer');
      listContainer.innerHTML = '';

      const books = ageData[age];
      books.forEach((book, index) => {
        const div = document.createElement('div');
        div.className = `rank-item ${index === 0 ? 'selected' : ''}`;
        div.setAttribute('data-index', index);
        div.onclick = function() { selectBook(index, true); };
        div.innerHTML = `
          <span class="rank-number">${index + 1}</span>
          <span class="rank-title">${escapeHTML(book.t)}</span>
          <span class="rank-author">${escapeHTML(book.a)}</span>
        `;
        listContainer.appendChild(div);
      });
      selectBook(0, false); // 1위 도서 초기 자동선택 (자동로딩이므로 사운드는 OFF)
    }

    // 📖 특정 도서 바인딩 세부 출력 제어
    function selectBook(index, shouldSpeak) {
      const items = document.querySelectorAll('.rank-item');
      items.forEach(item => item.classList.remove('selected'));
      const targetItem = document.querySelector(`.rank-item[data-index='${index}']`);
      if (targetItem) targetItem.classList.add('selected');

      const book = ageData[window.currentAgeGroup][index];
      document.getElementById('infoBadge').textContent = `${index + 1}위 도서 세부 정보`;
      document.getElementById('detailTitle').textContent = book.t;
      document.getElementById('detailAuthor').textContent = book.a + " 지음";
      document.getElementById('detailDesc').textContent = book.d;

      const reviewsContainer = document.getElementById('detailReviews');
      reviewsContainer.innerHTML = '';
      book.r.forEach(review => {
        const rDiv = document.createElement('div');
        rDiv.className = 'review-item';
        rDiv.textContent = `💬 "${review}"`;
        reviewsContainer.appendChild(rDiv);
      });

      if (shouldSpeak) playCurrentBookTTS();
    }

    function playCurrentBookTTS() {
      const title = document.getElementById('detailTitle').textContent;
      const author = document.getElementById('detailAuthor').textContent;
      const desc = document.getElementById('detailDesc').textContent;
      const fullText = `도서 선별 타이틀 ${title}, 저자 ${author}. 작품 소개. ${desc}`;
      playCustomTTS(fullText);
    }

    function escapeHTML(text) {
      return String(text).replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;');
    }

    window.onload = function() {
      switchAgeGroup('10', document.querySelector('.tab-btn'));
      setTimeout(() => {
        playCustomTTS("북 대시보드 시스템 빌드가 완료되었습니다. 탭을 선택하면 세대별 랭킹 오디오 가이드가 재생됩니다.");
      }, 600);
    };
  </script>
