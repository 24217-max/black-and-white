<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>실시간 AI 트렌드 검색 북 대시보드</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh;
      background: linear-gradient(135deg, #f1f5f9, #e2e8f0);
      font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', Arial, sans-serif;
      color: #1e293b; line-height: 1.6;
    }
    .container {
      width: min(1200px, 94%); margin: 30px auto;
      background: #ffffff; border-radius: 28px; padding: 32px;
      box-shadow: 0 20px 40px rgba(15, 23, 42, 0.08);
    }
    header {
      display: flex; justify-content: space-between; align-items: center;
      border-bottom: 2px solid #f1f5f9; padding-bottom: 20px; margin-bottom: 24px;
    }
    h1 { margin: 0; font-size: 24px; color: #0f172a; }
    .auth-panel { display: flex; align-items: center; gap: 12px; }
    .user-info { font-size: 14px; color: #475569; font-weight: 500; }
    .btn-auth {
      border: none; padding: 10px 18px; font-size: 14px; font-weight: bold;
      border-radius: 12px; cursor: pointer; transition: all 0.2s;
    }
    .btn-login { background: #2563eb; color: white; }
    .btn-logout { background: #64748b; color: white; }

    /* 오디오 바 */
    .audio-master-panel {
      display: flex; justify-content: center; gap: 10px; margin-bottom: 24px;
      background: #f8fafc; padding: 12px; border-radius: 16px; border: 1px solid #e2e8f0;
    }
    .audio-btn {
      border: none; padding: 8px 16px; font-size: 14px; font-weight: bold;
      border-radius: 8px; cursor: pointer; transition: all 0.2s;
    }
    .btn-stop { background: #ef4444; color: white; }
    .btn-pause { background: #f59e0b; color: white; }
    .btn-resume { background: #10b981; color: white; }

    /* 탭 스타일 */
    .tabs { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; margin-bottom: 28px; }
    .tab-btn {
      border: none; background: #f1f5f9; color: #475569; padding: 14px 0;
      font-size: 16px; font-weight: bold; border-radius: 14px; cursor: pointer;
      transition: all 0.15s ease; text-align: center;
    }
    .tab-btn.active { background: #2563eb; color: white; box-shadow: 0 6px 16px rgba(37, 99, 235, 0.25); }

    /* 레이아웃 */
    .content-grid { display: grid; grid-template-columns: 1.2fr 1fr; gap: 32px; }
    
    /* 좌측 상세창 */
    .detail-box {
      background: #f8fafc; border-radius: 24px; padding: 28px; border: 1px solid #e2e8f0;
      position: sticky; top: 20px; min-height: 400px;
    }
    .badge { display: inline-block; background: #2563eb; color: white; padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: bold; margin-bottom: 14px; }
    .book-title-container { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .book-title { font-size: 22px; margin: 0; color: #0f172a; font-weight: 800; }
    .tts-btn { background: #10b981; color: white; border: none; padding: 8px 14px; font-size: 14px; border-radius: 10px; cursor: pointer; font-weight: bold; }
    .book-author { font-size: 15px; color: #64748b; margin: 6px 0 24px; }
    .section-title { font-size: 16px; font-weight: bold; color: #334155; margin: 24px 0 8px; border-left: 4px solid #2563eb; padding-left: 10px; }
    .book-desc { font-size: 14px; color: #334155; background: white; padding: 16px; border-radius: 14px; border: 1px solid #e2e8f0; margin: 0; }
    .review-item { background: #fef3c7; color: #78350f; padding: 12px; border-radius: 12px; font-size: 13px; margin-bottom: 8px; font-style: italic; }

    /* 우측 리스트 */
    .rank-box { background: #ffffff; border-radius: 24px; padding: 8px; border: 1px solid #e2e8f0; max-height: 450px; overflow-y: auto; }
    .rank-list { display: flex; flex-direction: column; gap: 6px; }
    .rank-item { display: flex; align-items: center; padding: 14px 16px; background: #f8fafc; border-radius: 14px; font-size: 14px; border: 1px solid #f1f5f9; cursor: pointer; transition: all 0.15s ease; }
    .rank-item:hover { background: #eff6ff; }
    .rank-item.selected { background: #eff6ff; border-color: #2563eb; box-shadow: inset 4px 0 0 #2563eb; }
    .rank-number { font-weight: 800; width: 34px; color: #64748b; }
    .rank-title { font-weight: 600; color: #1e293b; flex-grow: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .rank-author { font-size: 13px; color: #64748b; padding-left: 10px; }

    /* 로딩 인디케이터 */
    .loading-layer { display: none; text-align: center; padding: 40px; font-weight: bold; color: #2563eb; }

    .history-box { margin-top: 24px; background: #f8fafc; padding: 16px; border-radius: 16px; border: 1px solid #e2e8f0; }
    .history-item { font-size: 13px; color: #475569; padding: 4px 0; border-bottom: 1px dashed #e2e8f0; }

    @media (max-width: 850px) {
      .tabs { grid-template-columns: repeat(3, 1fr); }
      .content-grid { grid-template-columns: 1fr; }
    }
  </style>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getDatabase, ref, push, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/database.js";
    import { GoogleGenAI } from "https://esm.run/@google/genai";

    // 🛠️ 전달받은 소중한 키 정보 완벽 적용 완료!
    const firebaseConfig = {
      apiKey: "AIzaSyBi_sBEMzAeJDsWJb6QjKqrYx4Gh38S7vE",
      authDomain: "small-minseong.firebaseapp.com",
      databaseURL: "https://small-minseong-default-rtdb.firebaseio.com",
      projectId: "small-minseong",
      storageBucket: "small-minseong.firebasestorage.app",
      messagingSenderId: "363007349157",
      appId: "1:363007349157:web:59d5a4b55213de2b65584c",
      measurementId: "G-6G2GRWPC19"
    };

    // 인스턴스 초기화
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const rtdb = getDatabase(app);
    const provider = new GoogleAuthProvider();
    
    // 파이어베이스 API 키를 바탕으로 인공지능 모델 동시 매핑
    const ai = new GoogleGenAI({ apiKey: firebaseConfig.apiKey });

    let currentUser = null;
    window.fetchedBooks = [];

    // 인증 유저 세션 구독
    onAuthStateChanged(auth, (user) => {
      const authPanel = document.getElementById('authPanel');
      if (user) {
        currentUser = user;
        authPanel.innerHTML = `
          <span class="user-info">👋 ${user.displayName}님</span>
          <button id="btnLogout" class="btn-auth btn-logout">로그아웃</button>
        `;
        document.getElementById('btnLogout').addEventListener('click', () => signOut(auth));
        loadUserRTDBLogs(user.uid);
      } else {
        currentUser = null;
        authPanel.innerHTML = `<button id="btnLogin" class="btn-auth btn-login">구글 로그인</button>`;
        document.getElementById('btnLogin').addEventListener('click', () => signInWithPopup(auth, provider));
        document.getElementById('historyList').innerHTML = '<p style="font-size:12px; color:#94a3b8; margin:0;">로그인 시 실시간 데이터베이스(RTDB) 이력이 연동됩니다.</p>';
      }
    });

    // 🤖 AI 탐색 엔진 내부 연동 로직
    async function fetchBooksViaAI(age) {
      const listContainer = document.getElementById('rankListContainer');
      const loading = document.getElementById('loadingLayer');
      
      listContainer.innerHTML = "";
      loading.style.display = "block";
      playCustomTTS(`${age}대 트렌드 도서를 제미나이 AI가 탐색하고 있습니다.`);

      try {
        const prompt = `2026년 현재 한국에서 ${age}대 독자들이 가장 많이 읽고 선호하는 베스트셀러 도서 5권을 조사해서 알려줘. 
        반드시 다른 설명글은 일절 제외하고 아래의 예시처럼 구조화된 순수 유효한 JSON 배열 포맷으로만 응답해줘.
        [
          {"t": "책제목1", "a": "저자1", "d": "이 세대가 이 책에 열광하는 구체적인 요인과 요약 내용", "r": ["가상 서평 리뷰1", "가상 서평 리뷰2"]},
          {"t": "책제목2", "a": "저자2", "d": "이 세대가 이 책에 열광하는 구체적인 요인과 요약 내용", "r": ["리뷰1", "리뷰2"]}
        ]`;

        const response = await ai.models.generateContent({
          model: 'gemini-2.5-flash',
          contents: prompt,
        });

        let cleanJsonText = response.text.trim();
        if (cleanJsonText.startsWith("```json")) {
          cleanJsonText = cleanJsonText.replace(/```json|```/g, "").trim();
        }

        window.fetchedBooks = JSON.parse(cleanJsonText);
        loading.style.display = "none";

        // 동적 UI 바인딩
        window.fetchedBooks.forEach((book, index) => {
          const div = document.createElement('div');
          div.className = `rank-item ${index === 0 ? 'selected' : ''}`;
          div.setAttribute('data-index', index);
          div.onclick = function() { selectBook(index, true); };
          div.innerHTML = `
            <span class="rank-number">${index + 1}</span>
            <span class="rank-title">${escapeHTML(book.t)}</span>
            <span class="rank-author">${escapeHTML(book.a)}</span>
          `;
          listContainer.appendChild(div);
        });

        selectBook(0, false);
        playCustomTTS(`탐색이 완료되었습니다. 1위 도서는 ${window.fetchedBooks[0].t} 입니다.`);

        // 로그인 유저 한정 Realtime Database에 기록 push 저장 연동
        if (currentUser) {
          const userLogRef = ref(rtdb, `user_logs/${currentUser.uid}`);
          push(userLogRef, {
            ageGroup: age,
            topBook: window.fetchedBooks[0].t,
            timestamp: Date.now()
          });
        }

      } catch (error) {
        console.error(error);
        loading.style.display = "none";
        listContainer.innerHTML = "<p style='padding:15px; color:#ef4444; font-size:13px;'>인증 토큰 동기화 혹은 API 호출 한도로 인해 데이터를 가져오지 못했습니다.</p>";
      }
    }

    // 💾 Realtime Database 데이터 실시간 수신 리스너 
    function loadUserRTDBLogs(uid) {
      const userLogRef = ref(rtdb, `user_logs/${uid}`);
      onValue(userLogRef, (snapshot) => {
        const historyList = document.getElementById('historyList');
        historyList.innerHTML = '';
        const data = snapshot.val();
        if(!data) {
          historyList.innerHTML = '<p style="font-size:12px; color:#94a3b8; margin:0;">아직 실시간 검색 이력이 기록되지 않았습니다.</p>';
          return;
        }
        // 오브젝트 루프 돌며 로그 역순 출력
        Object.values(data).reverse().forEach(log => {
          const div = document.createElement('div');
          div.className = 'history-item';
          div.textContent = `• [${log.ageGroup}대] 1위 도서: ${log.topBook} (Realtime DB 동기화 완료)`;
          historyList.appendChild(div);
        });
      });
    }

    function escapeHTML(text) {
      return String(text).replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;');
    }

    window.fetchBooksViaAI = fetchBooksViaAI;
  </script>
</head>
<body>

  <div class="container">
    <header>
      <h1>나만의 주제: AI 실시간 베스트셀러 대시보드 🎧</h1>
      <div class="auth-panel" id="authPanel"></div>
    </header>

    <div class="audio-master-panel">
      <button class="audio-btn btn-pause" onclick="window.speechSynthesis.pause()">❚❚ 일시정지</button>
      <button class="audio-btn btn-resume" onclick="window.speechSynthesis.resume()">▶ 이어듣기</button>
      <button class="audio-btn btn-stop" onclick="window.speechSynthesis.cancel()">◼ 음성 끄기</button>
    </div>

    <div class="tabs" id="tabContainer">
      <button class="tab-btn active" onclick="switchTab('10', this)">10대</button>
      <button class="tab-btn" onclick="switchTab('20', this)">20대</button>
      <button class="tab-btn" onclick="switchTab('30', this)">30대</button>
      <button class="tab-btn" onclick="switchTab('40', this)">40대</button>
      <button class="tab-btn" onclick="switchTab('50', this)">50대</button>
      <button class="tab-btn" onclick="switchTab('60', this)">60대+</button>
    </div>

    <div class="content-grid">
      <div class="detail-box">
        <div class="badge" id="infoBadge">도서 분석 창</div>
        <div class="book-title-container">
          <h2 class="book-title" id="detailTitle">상단 탭을 눌러 검색을 구동해 주세요.</h2>
          <button class="tts-btn" onclick="playCurrentBookTTS()">🔊 상세 설명 음성 듣기</button>
        </div>
        <div class="book-author" id="detailAuthor">저자 미정</div>

        <div class="section-title">AI 심층 추천 사유 요약</div>
        <p class="book-desc" id="detailDesc">사용자가 탭을 클릭하는 순간 인공지능이 데이터를 조합하여 동적 가독성을 확보합니다.</p>

        <div class="section-title">독자 반응 실시간 소셜 리뷰</div>
        <div id="detailReviews"></div>
      </div>

      <div>
        <div style="font-weight: bold; margin-bottom: 12px; color: #475569;">
          <span id="listAgeLabel">10대</span> 베스트 컬렉션 (AI 실시간)
        </div>
        
        <div class="loading-layer" id="loadingLayer">
          🚀 Gemini 인공지능 모델이 실시간 독서 트렌드를 가공 및 파싱 중입니다...
        </div>

        <div class="rank-box">
          <div class="rank-list" id="rankListContainer"></div>
        </div>

        <div class="history-box">
          <h4 style="margin: 0 0 10px 0; font-size: 14px; color:#1e293b;">📊 나의 실시간 연동 이력 (Firebase RTDB)</h4>
          <div id="historyList"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // TTS 오디오 허브 활성화
    function playCustomTTS(text) {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'ko-KR';
      utterance.rate = 1.05;
      window.speechSynthesis.speak(utterance);
    }

    // 탭 이동 제어
    function switchTab(age, element) {
      const buttons = document.querySelectorAll('.tab-btn');
      buttons.forEach(btn => btn.classList.remove('active'));
      if(element) element.classList.add('active');
      document.getElementById('listAgeLabel').textContent = age + "대";
      
      window.fetchBooksViaAI(age);
    }

    // 도서 상세 맵 바인딩
    function selectBook(index, shouldSpeak) {
      if(!window.fetchedBooks || window.fetchedBooks.length === 0) return;
      
      const items = document.querySelectorAll('.rank-item');
      items.forEach(item => item.classList.remove('selected'));
      const targetItem = document.querySelector(`.rank-item[data-index='${index}']`);
      if (targetItem) targetItem.classList.add('selected');

      const book = window.fetchedBooks[index];
      document.getElementById('infoBadge').textContent = `순위 ${index + 1}위 도서`;
      document.getElementById('detailTitle').textContent = book.t;
      document.getElementById('detailAuthor').textContent = book.a;
      document.getElementById('detailDesc').textContent = book.d;

      const reviewsContainer = document.getElementById('detailReviews');
      reviewsContainer.innerHTML = '';
      if(book.r && Array.isArray(book.r)) {
        book.r.forEach(review => {
          const rDiv = document.createElement('div');
          rDiv.className = 'review-item';
          rDiv.textContent = `💬 "${review}"`;
          reviewsContainer.appendChild(rDiv);
        });
      }

      if (shouldSpeak) playCurrentBookTTS();
    }

    function playCurrentBookTTS() {
      const title = document.getElementById('detailTitle').textContent;
      const author = document.getElementById('detailAuthor').textContent;
      const desc = document.getElementById('detailDesc').textContent;
      playCustomTTS(`제목 ${title}, 저자 ${author}. 추천 요약입니다. ${desc}`);
    }

    // 돔 로드 완료 시 진입점 실행
    window.addEventListener('load', () => {
      setTimeout(() => {
        switchTab('10', document.querySelector('.tab-btn'));
      }, 500);
    });
  </script>
</body>
</html>
